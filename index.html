<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Shelf</title>
    <script>
      // Apply the cached theme before first paint to avoid a flash.
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("pdf-shelf:theme") || "system";
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/ui/main.tsx"></script>
  </body>
</html>
